<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Redirecting...</title>
</head>
<body>
<noscript>JavaScript is required to complete DigiLocker verification.</noscript>
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var state = params.get('state') || '';
    if (state.indexOf('nomrp') !== -1) {
      window.location.replace('https://dev.nomrp.store/api/partners/digilocker/callback' + window.location.search);
    } else {
      document.body.textContent = 'Invalid or expired request.';
    }
  })();
</script>
</body>
</html>
